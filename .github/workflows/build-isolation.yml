# TEMPORARY diagnostic workflow.
# Isolates which build-time env var triggers the Bun SIGILL segfault in
# `bun --bun next build` on next 16.3.0. Delete once the trigger is found.
name: Build Isolation (temporary)

on:
  workflow_dispatch:

jobs:
  isolate:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          # Round 1 showed env is NOT the trigger: all five env variants,
          # including a full mirror of deploy.yml's env, built cleanly.
          # Round 2 replicates deploy.yml's job SHAPE instead.
          #
          # Control B: deploy env only. Known to PASS.
          - label: B-full-deploy-env
            prechecks: false
            cache: false
          # F: deploy env + the verification checks that precede the build.
          - label: F-with-prechecks
            prechecks: true
            cache: false
          # G: deploy env + the .next/cache restore step.
          - label: G-with-cache-step
            prechecks: false
            cache: true
          # H: both, i.e. a full replica of deploy.yml up to the build.
          - label: H-prechecks-and-cache
            prechecks: true
            cache: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run verification checks
        if: matrix.prechecks
        run: |
          set -euo pipefail

          bun run type-check
          bun run lint
          bun run test

      - name: Restore Next.js build cache
        if: matrix.cache
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('bun.lock') }}-${{ hashFiles('src/**/*.[jt]s', 'src/**/*.[jt]sx', 'public/**/*', 'next.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('bun.lock') }}-

      - name: Build with isolated env
        env:
          NEXT_PUBLIC_GA_ID: ${{ secrets.NEXT_PUBLIC_GA_ID }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_CMS_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: |
          # Do not use `set -e`: we want the exit code, not an aborted step.
          set +e
          bun run build
          code=$?
          set -e

          echo "=============================================="
          echo "VARIANT:    ${{ matrix.label }}"
          echo "EXIT CODE:  $code"
          echo "prechecks:  ${{ matrix.prechecks }}"
          echo "cache step: ${{ matrix.cache }}"

          # The crash happens at teardown, after the route table prints. Record
          # whether the export actually landed on disk despite the bad exit.
          if [ -d out ]; then
            echo "out/:      present ($(find out -type f | wc -l) files)"
          else
            echo "out/:      MISSING"
          fi
          echo "=============================================="

          exit $code
