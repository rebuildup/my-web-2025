# TEMPORARY diagnostic workflow.
# Isolates which build-time env var triggers the Bun SIGILL segfault in
# `bun --bun next build` on next 16.3.0. Delete once the trigger is found.
name: Build Isolation (temporary)

on:
  workflow_dispatch:

jobs:
  isolate:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          # Control A: mirrors ci.yml exactly. Expected to PASS.
          - label: A-ci-baseline
            ga: "G-DUMMY12345"
            site: "http://localhost:3000"
            cms: ""
            xtoken: ""
          # Control B: mirrors deploy.yml exactly. Expected to FAIL (SIGILL).
          - label: B-full-deploy-env
            ga: secret
            site: secret
            cms: secret
            xtoken: secret
          # C: deploy env minus X_BEARER_TOKEN.
          - label: C-no-x-token
            ga: secret
            site: secret
            cms: secret
            xtoken: ""
          # D: deploy env minus NEXT_PUBLIC_CMS_API_BASE_URL.
          - label: D-no-cms-base-url
            ga: secret
            site: secret
            cms: ""
            xtoken: secret
          # E: real secrets only for GA/SITE_URL (neither of the two added vars).
          - label: E-real-ga-site-only
            ga: secret
            site: secret
            cms: ""
            xtoken: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build with isolated env
        env:
          NEXT_PUBLIC_GA_ID: ${{ matrix.ga == 'secret' && secrets.NEXT_PUBLIC_GA_ID || matrix.ga }}
          NEXT_PUBLIC_SITE_URL: ${{ matrix.site == 'secret' && secrets.NEXT_PUBLIC_SITE_URL || matrix.site }}
          NEXT_PUBLIC_CMS_API_BASE_URL: ${{ matrix.cms == 'secret' && secrets.NEXT_PUBLIC_SITE_URL || matrix.cms }}
          X_BEARER_TOKEN: ${{ matrix.xtoken == 'secret' && secrets.X_BEARER_TOKEN || matrix.xtoken }}
        run: |
          # Do not use `set -e`: we want the exit code, not an aborted step.
          set +e
          bun run build
          code=$?
          set -e

          echo "=============================================="
          echo "VARIANT:   ${{ matrix.label }}"
          echo "EXIT CODE: $code"
          echo "GA set:    ${NEXT_PUBLIC_GA_ID:+yes}${NEXT_PUBLIC_GA_ID:-no}"
          echo "SITE:      ${NEXT_PUBLIC_SITE_URL:-unset}"
          echo "CMS BASE:  ${NEXT_PUBLIC_CMS_API_BASE_URL:+set}${NEXT_PUBLIC_CMS_API_BASE_URL:-unset}"
          echo "X TOKEN:   ${X_BEARER_TOKEN:+set}${X_BEARER_TOKEN:-unset}"

          # The crash happens at teardown, after the route table prints. Record
          # whether the export actually landed on disk despite the bad exit.
          if [ -d out ]; then
            echo "out/:      present ($(find out -type f | wc -l) files)"
          else
            echo "out/:      MISSING"
          fi
          echo "=============================================="

          exit $code
