# TEMPORARY diagnostic workflow.
# Isolates which build-time env var triggers the Bun SIGILL segfault in
# `bun --bun next build` on next 16.3.0. Delete once the trigger is found.
name: Build Isolation (temporary)

on:
  workflow_dispatch:

jobs:
  isolate:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          # Round 2 isolated the trigger to the verification checks that run
          # before the build (prechecks FAIL, cache step irrelevant). Round 3
          # narrows down WHICH command poisons the later build, and why
          # ci.yml survives running the same commands.
          - label: T-typecheck-only
            cmds: "bun run type-check"
          - label: L-lint-only
            cmds: "bun run lint"
          - label: U-test-only
            cmds: "bun test"
          - label: K-ci-order-with-knip
            cmds: "bun run type-check && bun run lint && bun x knip && bun test"
          - label: R-deploy-order-repro
            cmds: "bun run type-check && bun run lint && bun test"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run verification checks
        run: |
          set -euo pipefail

          ${{ matrix.cmds }}

      - name: Build with isolated env
        env:
          NEXT_PUBLIC_GA_ID: ${{ secrets.NEXT_PUBLIC_GA_ID }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_CMS_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: |
          # Do not use `set -e`: we want the exit code, not an aborted step.
          set +e
          bun run build
          code=$?
          set -e

          echo "=============================================="
          echo "VARIANT:    ${{ matrix.label }}"
          echo "EXIT CODE:  $code"
          echo "prechecks:  ${{ matrix.cmds }}"
          

          # The crash happens at teardown, after the route table prints. Record
          # whether the export actually landed on disk despite the bad exit.
          if [ -d out ]; then
            echo "out/:      present ($(find out -type f | wc -l) files)"
          else
            echo "out/:      MISSING"
          fi
          echo "=============================================="

          exit $code
