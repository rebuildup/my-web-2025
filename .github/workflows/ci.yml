name: CI

on:
  push:
    branches: [develop, main, 'release-*']
  pull_request:
    branches: [main, develop, 'release-*']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Continuous Integration Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install submodule deps
        run: bun --bun scripts/install-tools.ts

      - name: Type check
        run: bun run type-check

      - name: Biome Linter
        run: bun run lint

      - name: Tool isolation guard
        run: bun run check:tool-isolation

      - name: Knip Analysis
        run: bun x knip

      - name: Unit Tests
        run: bun run test

      - name: Next.js Static Export Build
        env:
          NEXT_PUBLIC_GA_ID: "G-DUMMY12345"
          NEXT_PUBLIC_SITE_URL: "http://localhost:3000"
        run: |
          set +e
          bun run build
          ec=$?
          if [ "$ec" -eq 132 ] && [ -f out/index.html ]; then
            echo "::warning::bun run build exited 132 (SIGILL at teardown), but out/index.html exists; proceeding"
            exit 0
          fi
          exit "$ec"
          test -f out/index.html || { echo "out/index.html missing after build"; exit 1; }

  rust:
    name: Rust CMS API gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install submodule deps
        run: bun --bun scripts/install-tools.ts

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          working-directory: apps/cms-api

      - name: cargo fmt
        working-directory: apps/cms-api
        run: cargo fmt --all -- --check

      - name: cargo clippy
        working-directory: apps/cms-api
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        working-directory: apps/cms-api
        run: cargo test --all-targets
