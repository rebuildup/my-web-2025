name: Bun Build, Static Export and Server Deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  # Isolated from the build job because `bun test` opens data/contents/*.db
  # via `bun:sqlite` and leaves WAL/SHM artifacts that poison the subsequent
  # `bun --bun next build` on the same runner (SIGILL at teardown). Running
  # checks on a fresh runner avoids the pollution while keeping all gating
  # checks inside the deploy workflow.
  verification:
    name: Verification Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run type-check

      - name: Biome Linter
        run: bun run lint

      - name: Knip Analysis
        run: bun x knip

      - name: Unit Tests
        run: bun run test

  deploy:
    name: Build & Deploy Static Export with Rust CMS API
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: verification

    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # NB: no .next/cache restore - the cache key only hashes bun.lock and
      # source files, not the Bun runtime version. A cache written by an
      # older Bun runtime segfaults `bun --bun next build` at teardown
      # (SIGILL 0x13CB0) on a fresh runner. Cost: ~30s slower per build;
      # gain: deterministic deploys.

      - name: Build Next.js static export
        env:
          NEXT_PUBLIC_GA_ID: ${{ secrets.NEXT_PUBLIC_GA_ID }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          # Bake absolute media URLs anchored at the public site so the static
          # export references https://yusuke-kim.com/api/cms/media?...; Nginx
          # proxies /api/ to the Rust CMS API on 127.0.0.1:3001.
          NEXT_PUBLIC_CMS_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: |
          set -euo pipefail

          # `bun --bun next build` currently segfaults at teardown under
          # Bun 1.3.14 with Next.js 16.3.0 (SIGILL 0x13CB0, in `bun:sqlite`
          # cleanup). The build itself completes - the route table and `out/`
          # land on disk before the crash. Tolerate the SIGILL exit (132) iff
          # the static export is present; otherwise propagate the failure.
          bun run build || {
            ec=$?
            if [ "$ec" -eq 132 ] && [ -f out/index.html ]; then
              echo "::warning::bun --bun next build exited 132 (SIGILL at teardown), but out/index.html exists; proceeding"
              exit 0
            fi
            exit "$ec"
          }

      - name: Validate and package static export
        run: |
          set -euo pipefail

          if [ ! -d out ]; then
            echo "Static export directory does not exist: out"
            exit 1
          fi

          if [ ! -f out/index.html ]; then
            echo "Static export entrypoint does not exist: out/index.html"
            echo "Top-level out contents:"
            ls -la out || true
            exit 1
          fi

          echo "=== Static export contents ==="
          find out -maxdepth 3 -type f | sort | sed -n '1,100p'

          tar -czf deployment-static.tar.gz -C out .

          echo "=== Static archive contents ==="
          tar -tzf deployment-static.tar.gz > /tmp/deployment-static-files.txt
          sed -n '1,100p' /tmp/deployment-static-files.txt

          echo "Archive file count: $(wc -l < /tmp/deployment-static-files.txt)"
          ls -lh deployment-static.tar.gz

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Build Rust CMS API backend
        run: |
          set -euo pipefail

          cd apps/cms-api
          cargo build --release --manifest-path Cargo.toml

          test -x target/release/cms-api

          tar -czf cms-api-binary.tar.gz \
            -C target/release \
            cms-api

      - name: Setup SSH config
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "${{ secrets.GCP_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          cat > ~/.ssh/config <<EOF
          Host deploy-server
            HostName ${{ secrets.GCP_HOST }}
            User ${{ secrets.GCP_USER }}
            IdentityFile ~/.ssh/id_rsa
            IdentitiesOnly yes
            StrictHostKeyChecking no
            ServerAliveInterval 30
            ServerAliveCountMax 5
          EOF

          chmod 600 ~/.ssh/config

      - name: Test SSH connection
        run: |
          set -euo pipefail

          ssh deploy-server '
            echo "SSH connection successful"
            hostname
          '

      - name: Transfer deployment packages
        run: |
          set -euo pipefail

          scp \
            deployment-static.tar.gz \
            deploy-server:/home/${{ secrets.GCP_USER }}/deployment-static.tar.gz

          scp \
            apps/cms-api/cms-api-binary.tar.gz \
            deploy-server:/home/${{ secrets.GCP_USER }}/cms-api-binary.tar.gz

      - name: Execute server deployment
        run: |
          ssh deploy-server 'bash -s' <<'REMOTE'
          set -euo pipefail

          APP_DIR="/var/www/yusuke-kim"
          RELEASES_DIR="$APP_DIR/releases"
          STATIC_RELEASE_DIR="$RELEASES_DIR/static-new"
          API_RELEASE_DIR="$RELEASES_DIR/cms-api-new"

          PACKAGE_PATH="$HOME/deployment-static.tar.gz"
          CMS_API_PATH="$HOME/cms-api-binary.tar.gz"

          DB_DIR="$APP_DIR/data/db"
          DB_BACKUP_DIR="$HOME/cms-db-backup"

          CMS_BINARY="$APP_DIR/apps/cms-api/target/release/cms-api"
          NGINX_CONF="/etc/nginx/sites-available/yusuke-kim"

          export CMS_API_HOST="127.0.0.1"
          export CMS_API_PORT="3001"
          export CMS_API_BASE_URL="http://127.0.0.1:3001"
          export CMS_USE_RUST_API="1"
          export CMS_API_DATA_DIR="$DB_DIR"

          echo "=== Deployment environment ==="
          echo "User: $(whoami)"
          echo "Home: $HOME"
          echo "App directory: $APP_DIR"

          # Bun is not automatically available in non-interactive SSH shells.
          export BUN_INSTALL="${BUN_INSTALL:-$HOME/.bun}"
          export PATH="$BUN_INSTALL/bin:$PATH"

          if ! command -v curl >/dev/null 2>&1; then
            echo "curl is required"
            exit 1
          fi

          if ! command -v bun >/dev/null 2>&1; then
            echo "Bun not found. Installing Bun..."
            curl -fsSL https://bun.sh/install | bash

            export BUN_INSTALL="$HOME/.bun"
            export PATH="$BUN_INSTALL/bin:$PATH"
          fi

          if ! command -v bun >/dev/null 2>&1; then
            echo "Bun installation failed"
            exit 1
          fi

          if ! command -v pm2 >/dev/null 2>&1; then
            echo "PM2 not found. Installing PM2 with Bun..."
            bun add --global pm2@6.0.14
          fi

          if ! command -v pm2 >/dev/null 2>&1; then
            echo "PM2 installation failed"
            exit 1
          fi

          echo "Bun: $(bun --version)"
          echo "PM2: $(pm2 --version)"

          if ! sudo -n true >/dev/null 2>&1; then
            echo "Passwordless sudo is required for deployment"
            exit 1
          fi

          if ! command -v nginx >/dev/null 2>&1; then
            echo "Nginx is not installed"
            exit 1
          fi

          if [ ! -f "$PACKAGE_PATH" ]; then
            echo "Static package does not exist: $PACKAGE_PATH"
            exit 1
          fi

          if [ ! -f "$CMS_API_PATH" ]; then
            echo "CMS API package does not exist: $CMS_API_PATH"
            exit 1
          fi

          mkdir -p "$APP_DIR"
          mkdir -p "$RELEASES_DIR"
          mkdir -p "$APP_DIR/apps/cms-api/target/release"
          mkdir -p "$DB_DIR"

          # Preserve CMS SQLite database across deployments.
          rm -rf "$DB_BACKUP_DIR"

          if [ -d "$DB_DIR" ] &&
             [ -n "$(ls -A "$DB_DIR" 2>/dev/null || true)" ]; then
            mkdir -p "$DB_BACKUP_DIR"
            cp -a "$DB_DIR/." "$DB_BACKUP_DIR/"
            echo "Backed up CMS DB to $DB_BACKUP_DIR"
          fi

          # Extract static export into a temporary release directory.
          rm -rf "$STATIC_RELEASE_DIR"
          mkdir -p "$STATIC_RELEASE_DIR"

          tar -xzf "$PACKAGE_PATH" -C "$STATIC_RELEASE_DIR"

          echo "=== Extracted static export ==="
          find "$STATIC_RELEASE_DIR" -maxdepth 3 -type f | sort | sed -n '1,100p'

          if [ ! -f "$STATIC_RELEASE_DIR/index.html" ]; then
            echo "Static archive does not contain index.html at its root"
            echo "Extracted directory contents:"
            ls -la "$STATIC_RELEASE_DIR" || true
            exit 1
          fi

          # Extract the Rust CMS binary into a temporary release directory.
          rm -rf "$API_RELEASE_DIR"
          mkdir -p "$API_RELEASE_DIR"

          tar -xzf "$CMS_API_PATH" -C "$API_RELEASE_DIR"

          if [ ! -f "$API_RELEASE_DIR/cms-api" ]; then
            echo "CMS API archive does not contain cms-api"
            ls -la "$API_RELEASE_DIR" || true
            exit 1
          fi

          chmod +x "$API_RELEASE_DIR/cms-api"

          # Stop the currently running API only after both packages validate.
          pm2 delete yusuke-kim 2>/dev/null || true
          pm2 delete cms-api 2>/dev/null || true

          # Atomically replace static output as much as possible.
          rm -rf "$APP_DIR/out.previous"

          if [ -d "$APP_DIR/out" ]; then
            mv "$APP_DIR/out" "$APP_DIR/out.previous"
          fi

          mv "$STATIC_RELEASE_DIR" "$APP_DIR/out"

          # Replace Rust CMS binary.
          install \
            -m 755 \
            "$API_RELEASE_DIR/cms-api" \
            "$CMS_BINARY"

          rm -rf "$API_RELEASE_DIR"

          # Restore the preserved database when present.
          if [ -d "$DB_BACKUP_DIR" ] &&
             [ -n "$(ls -A "$DB_BACKUP_DIR" 2>/dev/null || true)" ]; then
            mkdir -p "$DB_DIR"
            cp -a "$DB_BACKUP_DIR/." "$DB_DIR/"
            echo "Restored CMS DB from backup"
          fi

          # Ensure Nginx can read the static export
          sudo chown -R "$USER:www-data" "$APP_DIR/out"
          
          sudo chmod 755 /var/www
          sudo chmod 755 "$APP_DIR"
          
          sudo find "$APP_DIR/out" -type d -exec chmod 755 {} +
          sudo find "$APP_DIR/out" -type f -exec chmod 644 {} +

          if [ ! -r "$APP_DIR/out/index.html" ]; then
            echo "Static index is not readable: $APP_DIR/out/index.html"
            namei -l "$APP_DIR/out/index.html" || true
            exit 1
          fi

          echo "=== Deployed static entrypoint ==="
          ls -la "$APP_DIR/out/index.html"
          namei -l "$APP_DIR/out/index.html"

          # Write PM2 configuration for the native Rust binary.
          cat > "$APP_DIR/ecosystem.config.cjs" <<'ECOSYSTEM_EOF'
          module.exports = {
            apps: [
              {
                name: "cms-api",
                script: "/var/www/yusuke-kim/apps/cms-api/target/release/cms-api",
                interpreter: "none",
                cwd: "/var/www/yusuke-kim",
                env: {
                  RUST_LOG: "info",
                  CMS_API_DATA_DIR: "/var/www/yusuke-kim/data/db",
                  CMS_API_HOST: "127.0.0.1",
                  CMS_API_PORT: "3001"
                },
                autorestart: true,
                max_memory_restart: "200M",
                restart_delay: 5000,
                max_restarts: 10,
                min_uptime: "10s"
              }
            ]
          };
          ECOSYSTEM_EOF

          # Write Nginx configuration.
          if [ ! -d "/etc/nginx/sites-available" ]; then
            echo "/etc/nginx/sites-available does not exist"
            exit 1
          fi

          sudo tee "$NGINX_CONF" >/dev/null <<'NGINX_EOF'
          server {
              listen 80 default_server;
              listen [::]:80 default_server;

              server_name yusuke-kim.com *.yusuke-kim.com _;

              root /var/www/yusuke-kim/out;
              index index.html;

              access_log /var/log/nginx/yusuke-kim-access.log;
              error_log /var/log/nginx/yusuke-kim-error.log;

              # HSTS: tell browsers to never attempt HTTP for this host so
              # Lighthouse's "is-on-https" audit does not log the initial
              # insecure 307 redirect as a security failure.
              add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

              client_max_body_size 50M;

              # Next.js static export: never SPA-fallback missing RSC/chunk
              # paths to index.html (that returns HTML where JSON is expected).
              location = / {
                  try_files /index.html =404;
              }

              # Try the file directly first, then fall back to `<uri>/index.html`
              # so that requests without a trailing slash (e.g. `/workshop`) are
              # served from `out/workshop/index.html` without an external 301
              # redirect. The previous `$uri/` form caused nginx to issue an
              # extra redirect (and downgrade the URL to http://) which
              # Lighthouse penalised in the "Avoid multiple page redirects"
              # audit (~800 ms wasted on every page entry).
              location / {
                  try_files $uri $uri/index.html $uri.html =404;
              }

              location /_next/static/ {
                  try_files $uri =404;
                  expires 1y;
                  add_header Cache-Control "public, max-age=31536000, immutable";
              }

              location /api/ {
                  proxy_pass http://127.0.0.1:3001/api/;
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }

              location ~ ^/(entries|markdown|media|tags|search|preview|health) {
                  proxy_pass http://127.0.0.1:3001;
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }
          }
          NGINX_EOF

          sudo ln -sf \
            "$NGINX_CONF" \
            /etc/nginx/sites-enabled/yusuke-kim

          sudo rm -f /etc/nginx/sites-enabled/default

          sudo nginx -t

          if sudo systemctl is-active --quiet nginx; then
            sudo systemctl reload nginx
          else
            sudo systemctl start nginx
          fi

          sudo systemctl enable nginx >/dev/null

          if ! sudo systemctl is-active --quiet nginx; then
            echo "Nginx failed to start"
            sudo systemctl status nginx --no-pager || true
            sudo journalctl -u nginx --no-pager -n 100 || true
            exit 1
          fi

          # Start Rust CMS API.
          cd "$APP_DIR"

          pm2 start ecosystem.config.cjs
          pm2 save

          # Verify Rust CMS API.
          RUST_HEALTH_OK=0

          for attempt in {1..15}; do
            if curl \
              --fail \
              --silent \
              --show-error \
              --connect-timeout 2 \
              --max-time 5 \
              http://127.0.0.1:3001/health \
              >/dev/null; then
              RUST_HEALTH_OK=1
              break
            fi

            echo "Waiting for Rust CMS API: attempt $attempt"
            sleep 2
          done

          if [ "$RUST_HEALTH_OK" -ne 1 ]; then
            echo "Health check failed for Rust CMS API"
            pm2 status || true
            pm2 logs cms-api --lines 100 --nostream || true
            exit 1
          fi

          # Verify Nginx static pages + Rust API routes via local loopback.
          check_local() {
            local path="$1"
            local expected_ctype_hint="${2:-}"
            local status body_file
            body_file="$(mktemp)"
            status="$(
              curl \
                --silent \
                --show-error \
                --output "$body_file" \
                --write-out '%{http_code}' \
                --connect-timeout 2 \
                --max-time 8 \
                -H 'Host: yusuke-kim.com' \
                "http://127.0.0.1${path}" ||
              true
            )"
            echo "Local check ${path}: HTTP ${status}"
            if [ "$status" != "200" ]; then
              echo "Failed local check for ${path}"
              head -50 "$body_file" || true
              rm -f "$body_file"
              return 1
            fi
            if [ -n "$expected_ctype_hint" ]; then
              local ctype
              ctype="$(
                curl \
                  --silent \
                  --show-error \
                  --head \
                  --connect-timeout 2 \
                  --max-time 5 \
                  -H 'Host: yusuke-kim.com' \
                  "http://127.0.0.1${path}" |
                tr -d '\r' |
                awk -F': ' 'tolower($1)=="content-type"{print tolower($2); exit}'
              )"
              case "$ctype" in
                *"$expected_ctype_hint"*) ;;
                *)
                  echo "Unexpected content-type for ${path}: ${ctype}"
                  rm -f "$body_file"
                  return 1
                  ;;
              esac
            fi
            # Guard against SPA fallback serving HTML for missing assets.
            if [[ "$path" == /_next/* ]] || [[ "$path" == /api/* ]] || [[ "$path" == /entries* ]] || [[ "$path" == /health ]]; then
              if head -c 15 "$body_file" | grep -qi '<!doctype html'; then
                echo "Got HTML where API/asset expected for ${path}"
                rm -f "$body_file"
                return 1
              fi
            fi
            rm -f "$body_file"
            return 0
          }

          STATIC_HEALTH_OK=0
          for attempt in {1..15}; do
            if check_local "/" "text/html" \
              && check_local "/about/" "text/html" \
              && check_local "/portfolio/" "text/html" \
              && check_local "/workshop/" "text/html" \
              && check_local "/health" \
              && check_local "/entries" \
              && check_local "/api/content/portfolio?limit=5" "json" \
              && check_local "/favicons/favicon-192x192.png"; then
              STATIC_HEALTH_OK=1
              break
            fi
            echo "Waiting for full local verification: attempt $attempt"
            sleep 2
          done

          if [ "$STATIC_HEALTH_OK" -ne 1 ]; then
            echo "Nginx/static/API verification failed"

            echo "=== Static files ==="
            ls -la "$APP_DIR/out" || true
            find "$APP_DIR/out" -maxdepth 2 -type d | sort || true

            echo "=== Nginx status ==="
            sudo systemctl status nginx --no-pager || true

            echo "=== Nginx site error log ==="
            sudo tail -100 /var/log/nginx/yusuke-kim-error.log || true

            echo "=== Nginx site access log ==="
            sudo tail -100 /var/log/nginx/yusuke-kim-access.log || true

            echo "=== Effective Nginx configuration ==="
            sudo nginx -T || true

            # Restore the previous static release when available.
            if [ -d "$APP_DIR/out.previous" ]; then
              echo "Restoring previous static release"

              rm -rf "$APP_DIR/out.failed"
              mv "$APP_DIR/out" "$APP_DIR/out.failed"
              mv "$APP_DIR/out.previous" "$APP_DIR/out"

              sudo nginx -t
              sudo systemctl reload nginx
            fi

            exit 1
          fi

          # Deployment succeeded, so the previous release is no longer needed.
          rm -rf "$APP_DIR/out.previous"

          rm -f "$PACKAGE_PATH"
          rm -f "$CMS_API_PATH"
          rm -rf "$DB_BACKUP_DIR"

          echo "Static export and Rust backend deployed successfully"
          REMOTE

      - name: Verify public production site
        run: |
          set -euo pipefail

          PRODUCTION_URL="${{ secrets.NEXT_PUBLIC_SITE_URL }}"

          if [ -z "$PRODUCTION_URL" ]; then
            PRODUCTION_URL="https://yusuke-kim.com"
          fi

          # Trim trailing slash for consistent path joins
          PRODUCTION_URL="${PRODUCTION_URL%/}"

          echo "Checking public site: $PRODUCTION_URL"

          check_public() {
            local path="$1"
            local status
            status="$(
              curl \
                --silent \
                --show-error \
                --output /tmp/production-response.body \
                --write-out '%{http_code}' \
                --connect-timeout 5 \
                --max-time 20 \
                --location \
                "${PRODUCTION_URL}${path}" ||
              true
            )"
            echo "Public check ${path}: HTTP ${status}"
            case "$status" in
              200|301|302|304) return 0 ;;
              *) return 1 ;;
            esac
          }

          for attempt in {1..12}; do
            if check_public "/" \
              && check_public "/about/" \
              && check_public "/portfolio/" \
              && check_public "/workshop/" \
              && check_public "/health" \
              && check_public "/entries" \
              && check_public "/api/content/portfolio?limit=5" \
              && check_public "/favicons/favicon-192x192.png"; then
              echo "Public production verification succeeded"
              exit 0
            fi
            sleep 5
          done

          echo "Public production verification failed"
          echo "Response body:"
          head -100 /tmp/production-response.body || true
          exit 1