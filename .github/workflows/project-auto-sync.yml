# Disabled 2026-09-12 (Sprint 2.2.0 close): TDZ bug + project board not used. Re-enable by removing the if:false gate.

name: Project board auto-sync

# Keeps the GitHub Project "Status" field in sync with PR lifecycle events so the
# board reflects current state without manual updates. See docs/agent/agile-premises.md
# § 2.1 / § 2.3 for the column contract.
#
# Authentication: GitHub App installation token (1h, auto-rotated). This avoids
# the need for a long-lived PAT with `project` scope — the `GITHUB_TOKEN` exposed
# to workflows intentionally lacks project-level permissions per GitHub's
# security model. A GitHub App installed on the target project provides scoped,
# short-lived credentials that match the project's owner-scope rules.
#
# Required repo/org variables (configure at repo Settings → Secrets and
# variables → Actions → Variables — these are identifiers, not secrets):
#   PROJECT_NODE_ID             — GraphQL node ID of the Project V2 (e.g. PVT_xxx)
#   STATUS_FIELD_ID             — GraphQL node ID of the Status field on the Project
#   PROJECT_APP_ID              — Numeric App ID from the GitHub App "General" page
#   PROJECT_APP_INSTALLATION_ID — Numeric Installation ID from the GitHub App
#                                 "Install App" tab URL (…/installations/<ID>)
#
# Required repo/org secret:
#   PROJECT_APP_PRIVATE_KEY     — RSA private key (PEM) generated on the App page
#                                 under "Private keys". Store exactly the
#                                 -----BEGIN RSA PRIVATE KEY----- contents.

on:
  pull_request:
    types: [opened, reopened, ready_for_review, converted_to_draft, closed]

concurrency:
  group: project-auto-sync-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  sync-status:
    name: Sync Project Status
    runs-on: ubuntu-latest
    # Disabled 2026-09-12 (Sprint 2.2.0 close): TDZ bug in actions/github-script
    # (`const { graphql } = await graphql.defaults(...)` evaluates before
    # assignment) AND the project board is not actively used in Sprint 2.2.0.
    # Re-enable by removing this `if: false` gate after fixing the TDZ bug.
    if: false
    # Original base-ref gate preserved below for reference when re-enabling.
    # if: github.event.pull_request.base.ref == 'release-*' || github.event.pull_request.base.ref == 'main'
    steps:
      - name: Resolve target Status option
        id: resolve
        env:
          EVENT_ACTION: ${{ github.event.action }}
          MERGED: ${{ github.event.pull_request.merged }}
        run: |
          set -euo pipefail
          case "$EVENT_ACTION" in
            opened)
              # Newly opened PRs are immediately ready for review by repo convention.
              STATUS="In Review"
              ;;
            reopened)
              STATUS="In Review"
              ;;
            ready_for_review)
              STATUS="In Review"
              ;;
            converted_to_draft)
              # Draft conversion signals active work resuming on the ticket.
              STATUS="In Progress"
              ;;
            closed)
              if [[ "$MERGED" == "true" ]]; then
                STATUS="Done"
              else
                # Closed without merge → back to backlog for rework.
                STATUS="Backlog"
              fi
              ;;
            *)
              echo "::error::Unhandled PR action '$EVENT_ACTION'"
              exit 1
              ;;
          esac
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

      - name: Generate GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.PROJECT_APP_ID }}
          private-key: ${{ secrets.PROJECT_APP_PRIVATE_KEY }}
          installation-id: ${{ vars.PROJECT_APP_INSTALLATION_ID }}

      - name: Update Project Status
        uses: actions/github-script@v8
        env:
          PROJECT_NODE_ID: ${{ vars.PROJECT_NODE_ID }}
          STATUS_FIELD_ID: ${{ vars.STATUS_FIELD_ID }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          TARGET_STATUS: ${{ steps.resolve.outputs.status }}
          PR_NODE_ID: ${{ github.event.pull_request.node_id }}
        with:
          script: |
            const required = {
              PROJECT_NODE_ID: process.env.PROJECT_NODE_ID,
              STATUS_FIELD_ID: process.env.STATUS_FIELD_ID,
              APP_TOKEN: process.env.APP_TOKEN,
            };
            for (const [key, value] of Object.entries(required)) {
              if (!value) {
                core.setFailed(`Missing required env var: ${key}. Configure it at repo Settings → Secrets and variables → Actions.`);
                return;
              }
            }

            const target = process.env.TARGET_STATUS;
            const prNodeId = process.env.PR_NODE_ID;

            // Use the GitHub App installation token (1h, scoped to the project).
            const { graphql } = await graphql.defaults({
              headers: { authorization: `bearer ${process.env.APP_TOKEN}` },
            });

            // Retry helper for transient (5xx, network, rate-limit) GraphQL errors.
            // Permanent errors (auth, schema, validation) propagate immediately so
            // they surface as clear failures instead of being masked by retries.
            const RETRYABLE = /5\d\d|rate limit|ETIMEDOUT|ECONNRESET|ENOTFOUND/i;
            async function withRetry(label, fn, attempts = 3) {
              let lastErr;
              for (let i = 1; i <= attempts; i++) {
                try {
                  return await fn();
                } catch (e) {
                  lastErr = e;
                  const msg = String(e?.message ?? e);
                  if (!RETRYABLE.test(msg) || i === attempts) throw e;
                  const delayMs = 500 * 2 ** (i - 1); // 0.5s, 1s, 2s
                  core.warning(`${label}: transient error (attempt ${i}/${attempts}): ${msg}; retrying in ${delayMs}ms`);
                  await new Promise((r) => setTimeout(r, delayMs));
                }
              }
              throw lastErr;
            }

            // 1. Resolve the Status field options to find the option ID for TARGET_STATUS.
            //    Validate the field type is the expected SingleSelect — otherwise the
            //    workflow is misconfigured (e.g. STATUS_FIELD_ID points at a text field)
            //    and we should fail loudly instead of silently dropping the update.
            const fieldQuery = await withRetry('Status field query', () => graphql(`
              query($projectId: ID!, $fieldId: ID!) {
                node(id: $projectId) {
                  ... on ProjectV2 {
                    field(id: $fieldId) {
                      __typename
                      ... on ProjectV2SingleSelectField {
                        options { id name }
                      }
                    }
                  }
                }
              }
            `, {
              projectId: process.env.PROJECT_NODE_ID,
              fieldId: process.env.STATUS_FIELD_ID,
            }));

            const field = fieldQuery.node?.field;
            if (!field) {
              core.setFailed(`STATUS_FIELD_ID ${process.env.STATUS_FIELD_ID} does not exist on project ${process.env.PROJECT_NODE_ID}.`);
              return;
            }
            if (field.__typename !== 'ProjectV2SingleSelectField') {
              core.setFailed(`STATUS_FIELD_ID points to ${field.__typename}, expected ProjectV2SingleSelectField. Re-check the field id at repo Settings → Projects.`);
              return;
            }

            const options = field.options ?? [];
            const match = options.find((o) => o.name === target);
            if (!match) {
              core.setFailed(`Status field has no option named '${target}'. Available: ${options.map((o) => o.name).join(', ')}`);
              return;
            }

            // 2. Find any existing project item (PR or DraftIssue) for this PR.
            //    Paginate via pageInfo.hasNextPage / endCursor — large projects have
            //    far more than 50 items and a single page could miss the PR.
            let cursor = null;
            let item = null;
            let pageCount = 0;
            outer: while (pageCount < 50) { // hard cap so a runaway loop can't hang the run
              pageCount++;
              const itemQuery = await withRetry(`Items query (page ${pageCount})`, () => graphql(`
                query($projectId: ID!, $after: String) {
                  node(id: $projectId) {
                    ... on ProjectV2 {
                      items(first: 50, after: $after) {
                        pageInfo { hasNextPage endCursor }
                        nodes {
                          id
                          content {
                            ... on PullRequest { id number }
                            ... on DraftIssue { id }
                          }
                        }
                      }
                    }
                  }
                }
              `, {
                projectId: process.env.PROJECT_NODE_ID,
                after: cursor,
              }));

              const items = itemQuery.node?.items?.nodes ?? [];
              const hit = items.find((i) => i.content?.id === prNodeId);
              if (hit) {
                item = hit;
                break outer;
              }
              const pageInfo = itemQuery.node?.items?.pageInfo;
              if (!pageInfo?.hasNextPage) break outer;
              cursor = pageInfo.endCursor;
            }

            if (!item) {
              // PR is not on the project board — warn (visible in run summary) so a
              // missing ticket doesn't look like a silent success. The maintainer may
              // add it later.
              core.warning(`PR ${prNodeId} is not yet tracked on the project board (searched ${pageCount} page(s)). Skipping Status update.`);
              return;
            }

            // 3. Update the Status field on the matched project item.
            await withRetry('Status update mutation', () => graphql(`
              mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                updateProjectV2ItemFieldValue(
                  input: {
                    projectId: $projectId
                    itemId: $itemId
                    fieldId: $fieldId
                    value: { singleSelectOptionId: $optionId }
                  }
                ) {
                  projectV2Item { id }
                }
              }
            `, {
              projectId: process.env.PROJECT_NODE_ID,
              itemId: item.id,
              fieldId: process.env.STATUS_FIELD_ID,
              optionId: match.id,
            }));

            core.info(`Updated PR ${prNodeId} → Status '${target}' on project ${process.env.PROJECT_NODE_ID} (page ${pageCount}).`);