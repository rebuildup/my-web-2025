name: sync-submodules

# Polls each submodule's main branch tip and bumps the parent gitlink
# when the submodule has advanced. This implements the "submodule main
# merge → my-web-2025 gitlink update" flow described in AGENTS.md §14.
#
# Why pull-based: 13 submodules would otherwise each need a
# PARENT_REPO_TOKEN secret to call repository_dispatch. A 15-minute
# poll on the parent side needs no cross-repo credentials.
#
# Triggers:
#   - schedule: every 15 min (catches all submodule main advances)
#   - workflow_dispatch: manual on-demand run from the Actions tab
#
# Output: opens (or updates) a PR titled "chore(submodule): sync
# gitlinks to origin/main tip" against main. The PR triggers the
# existing CI gate.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: sync-submodules
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Detect drift + bump gitlinks + open PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout parent (no submodules)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Setup git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Detect submodule drift
        id: drift
        run: |
          set -euo pipefail
          : > /tmp/drift.txt
          drifted=""
          # Iterate submodule paths from .gitmodules. Skip prototype
          # (Phase 1 Vite sub-project, intentionally not pinned to a
          # moving tip — AGENTS.md §14 quality debt).
          for path in $(git config -f .gitmodules --get-regexp '^submodule\..*\.path$' | awk '{print $2}'); do
            if [ "$path" = "external/prototype" ]; then
              echo "::notice::skipping $path (Phase 1 prototype, not pinned)"
              continue
            fi
            url=$(git config -f .gitmodules "submodule.$path.url")
            branch=$(git config -f .gitmodules "submodule.$path.branch" 2>/dev/null || echo "main")
            if [ -z "$url" ]; then
              echo "::warning::$path: missing url, skipping"
              continue
            fi
            current=$(git ls-tree HEAD -- "$path" | awk '{print $3}' || true)
            remote=$(git ls-remote --heads "$url" "$branch" 2>/dev/null | awk '{print $1}' || true)
            if [ -z "$remote" ]; then
              echo "::warning::$path: no remote tip on $branch, skipping"
              continue
            fi
            if [ "$current" != "$remote" ]; then
              short=${remote:0:7}
              echo "::notice::$path: ${current:0:7} -> $short"
              echo "$path|$current|$remote" >> /tmp/drift.txt
              drifted="$drifted $path"
            fi
          done
          count=$(awk 'END{print NR}' /tmp/drift.txt)
          has_drift="false"
          if [ "$count" -gt 0 ] 2>/dev/null; then has_drift="true"; fi
          echo "drift_count=$count" >> "$GITHUB_OUTPUT"
          echo "has_drift=$has_drift" >> "$GITHUB_OUTPUT"
          {
            echo "drifted=$drifted"
            echo "## Detected drift"
            if [ "$count" = "0" ]; then
              echo "(none — all submodules match origin/main tip)"
            else
              while IFS='|' read -r p b a; do
                [ -z "$p" ] && continue
                echo "- \`$p\`: \`${b:0:7}\` -> \`${a:0:7}\`"
              done < /tmp/drift.txt
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$count" = "0" ]; then
            echo "no drift detected across all submodules"
          fi

      - name: Bump gitlinks
        if: steps.drift.outputs.has_drift == 'true'
        run: |
          set -euo pipefail
          branch="chore/sync-submodules-$(date -u +%Y%m%dT%H%M%SZ)"
          git checkout -b "$branch"
          git submodule update --remote --merge
          if git diff --cached --quiet && git diff --quiet; then
            echo "::warning::no changes after submodule update, aborting (rolling back branch)"
            git checkout main
            git branch -D "$branch"
            exit 0
          fi
          git add external/
          {
            echo "chore(submodule): sync gitlinks to origin/main tip"
            echo ""
            echo "Auto-generated by .github/workflows/sync-submodules.yml."
            echo "Submodules advanced:"
            while IFS='|' read -r p b a; do
              [ -z "$p" ] && continue
              echo "  - $p: ${b:0:7} -> ${a:0:7}"
            done < /tmp/drift.txt
            echo ""
            echo "Refs: AGENTS.md §14."
          } > /tmp/commit-msg.txt
          git commit -F /tmp/commit-msg.txt
          git push -u origin "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Open or update PR
        if: steps.drift.outputs.has_drift == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          branch=$(git rev-parse --abbrev-ref HEAD)
          existing=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "PR #$existing already open for $branch; the new push will update it"
            exit 0
          fi
          {
            echo "Auto-generated by \`.github/workflows/sync-submodules.yml\`."
            echo ""
            echo "One or more submodule repos advanced their \`main\` branch tip. This PR bumps the parent gitlinks via \`git submodule update --remote --merge\` so my-web-2025 picks up the new submodule SHAs."
            echo ""
            echo "## Submodules advanced"
            while IFS='|' read -r p b a; do
              [ -z "$p" ] && continue
              echo "- \`$p\`: \`${b:0:7}\` -> \`${a:0:7}\`"
            done < /tmp/drift.txt
            echo ""
            echo "Refs: AGENTS.md §14."
          } > /tmp/pr-body.md
          gh pr create \
            --base main \
            --head "$branch" \
            --title "chore(submodule): sync gitlinks to origin/main tip" \
            --body-file /tmp/pr-body.md
