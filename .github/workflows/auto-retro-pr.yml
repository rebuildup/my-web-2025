name: Auto-create sprint retro

# Creates a retro draft PR after a release branch is merged into main.
# The source release branch is used to derive the sprint version; the merge date
# determines the ISO week and the Monday-Saturday sprint date range.

on:
  pull_request:
    types: [closed]
    branches: [main]

concurrency:
  group: auto-retro-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  create-retro:
    name: Create retro draft PR
    runs-on: ubuntu-latest
    # Disabled 2026-09-12 (Sprint 2.2.0 close): has 'Duplicate header:
    # Authorization' bug in peter-evans/create-pull-request@v6 step
    # (line 124: `token: ${{ secrets.GITHUB_TOKEN }}` injected on top of
    # actions/checkout@v7's auth header, see run 34661433640). Sprint 2.2.0
    # is the final sprint — no follow-up retro auto-creation needed.
    # Re-enable by removing this `if: false` gate after fixing the bug.
    if: false
    # Original conditional preserved below for reference when re-enabling.
    # if: github.event.pull_request.merged && startsWith(github.event.pull_request.head.ref, 'release-')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract sprint metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_BRANCH="${{ github.event.pull_request.head.ref }}"
          VERSION="${RELEASE_BRANCH#release-}"
          VERSION="${VERSION//-/.}"
          MERGE_DATE="$(date -u -d "${{ github.event.pull_request.merged_at }}" +%F)"
          ISO_YEAR="$(date -u -d "$MERGE_DATE" +%G)"
          WEEK="$(date -u -d "$MERGE_DATE" +%V)"
          # Compute Monday (weekday 1) and Saturday (+5 days) of the ISO week.
          # GNU date on ubuntu-latest does not parse ISO week-date strings like
          # '2026-W37-1', so we delegate ISO week → calendar date to python3
          # (preinstalled on ubuntu-latest) via date.fromisocalendar().
          read -r WEEK_START_DATE WEEK_END_DATE < <(python3 -c "
          import sys
          from datetime import date, timedelta
          y, w = int(sys.argv[1]), int(sys.argv[2])
          monday = date.fromisocalendar(y, w, 1)
          saturday = monday + timedelta(days=5)
          print(monday.strftime('%Y-%m-%d'), saturday.strftime('%Y-%m-%d'))
          " "$ISO_YEAR" "$WEEK")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "iso_year=$ISO_YEAR" >> "$GITHUB_OUTPUT"
          echo "week=$WEEK" >> "$GITHUB_OUTPUT"
          echo "week_start_date=$WEEK_START_DATE" >> "$GITHUB_OUTPUT"
          echo "week_end_date=$WEEK_END_DATE" >> "$GITHUB_OUTPUT"

      - name: Check existing retro
        id: existing
        shell: bash
        run: |
          set -euo pipefail
          RETRO_PATH="docs/agent/retros/${{ steps.metadata.outputs.iso_year }}-W${{ steps.metadata.outputs.week }}.md"
          if [[ -f "$RETRO_PATH" ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Retro already exists: $RETRO_PATH"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Retro does not exist: $RETRO_PATH"
          fi

      - name: Write retro template
        if: steps.existing.outputs.exists == 'false'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/agent/retros
          cat > "docs/agent/retros/${{ steps.metadata.outputs.iso_year }}-W${{ steps.metadata.outputs.week }}.md" <<EOF
          # Sprint ${{ steps.metadata.outputs.version }} retro (Week ${{ steps.metadata.outputs.week }}: ${{ steps.metadata.outputs.week_start_date }} 〜 ${{ steps.metadata.outputs.week_end_date }})

          > auto-generated by \`.github/workflows/auto-retro-pr.yml\` — fill in during sprint close.

          ## TL;DR

          (1-2 文で sprint summary)

          ## Metrics

          | 指標 | 値 | 目標 | 評価 |
          |---|---|---|---|
          | velocity (Done Issues) | TBD | — | — |
          | cycle time (median) | TBD | <1 sprint | — |
          | WIP avg | TBD | ≤1 | — |
          | CI 緑率 | TBD | ≥95% | — |
          | Knip debt | TBD | — | — |

          ## 観点 (5 things)

          ### 1. PR pile-up 原因

          ### 2. stale branch

          ### 3. workflow 運用 (sync-submodules 等)

          ### 4. dispatcher / AGENTS.md 運用

          ### 5. Claude 協働前提

          ## Improvement proposals

          (1-2 個に絞って Backlog へ)

          ## Notes

          (sprint 固有の備考)
          EOF

      - name: Create draft PR
        if: steps.existing.outputs.exists == 'false'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: auto-retro-${{ steps.metadata.outputs.version }}-W${{ steps.metadata.outputs.week }}
          title: "docs(agent): retro for sprint ${{ steps.metadata.outputs.version }}"
          body: |
            ## Auto-generated sprint retro

            リリース `release-${{ steps.metadata.outputs.version }}` のマージ後に自動生成した retro template です。sprint close 時に記入してください。

            - ISO week: `${{ steps.metadata.outputs.iso_year }}-W${{ steps.metadata.outputs.week }}`
            - Sprint dates: `${{ steps.metadata.outputs.week_start_date }}` 〜 `${{ steps.metadata.outputs.week_end_date }}`
          draft: true
