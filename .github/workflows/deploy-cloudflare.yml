name: Deploy Cloudflare (Workers + Container)

# Deploys the Cloudflare Workers Router (`workers/router/wrangler.toml`) on
# every push to `main` and on manual dispatch. The wrangler.toml `[[containers]]`
# block causes a single `wrangler deploy` to also build + push the Rust CMS API
# Container image, so this workflow covers both Worker and Container in one step.
#
# Cloudflare Pages builds run out-of-band via the GitHub integration configured
# in the Cloudflare Dashboard; this workflow does not touch Pages.
#
# Required GitHub Secrets:
#   - CLOUDFLARE_API_TOKEN (Workers:edit + R2:write + Account:read +
#     Cloudflare Containers:write scope, TTL ≤ 90d)
#   - CLOUDFLARE_ACCOUNT_ID
#
# Workers Secrets that this workflow pushes via `wrangler secret put` from
# the matching GitHub Secrets (set via `gh secret set --body <value>` per
# AGENTS.md §9). The canonical set:
#   RESEND_API_KEY, RECAPTCHA_SECRET_KEY, X_BEARER_TOKEN,
#   R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, SENTRY_DSN
# Missing / empty values are skipped (the corresponding API surface stays
# inert rather than failing the deploy).
#
# SIGILL 132 note: `bun --bun next build` segfaults at teardown under Bun 1.3.14
# + Next.js 16.3.0 (`bun:sqlite` cleanup). The static export writes to `out/`
# before the crash, so the workflow tolerates a 132 exit iff `out/index.html`
# is present. See AGENTS.md §14 for the documented workaround.

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Build + Deploy Workers / Container / Static Assets
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Install workspace dependencies (external/* + workers/*)
        run: bun --bun scripts/install-tools.ts

      # Offline-build pattern (Cloudflare Pages): materialise the CMS index +
      # markdown pages from the Container into `node_modules/.cache/cms-build/`
      # BEFORE `next build` runs. The build step then points
      # `fetchCmsContentIndex` / `fetchMarkdownPages` at the dumped JSON via
      # `CMS_INDEX_JSON` + `CMS_MARKDOWN_JSON` (read by
      # `src/cms/lib/content-db-manager.ts:461,1035`). This avoids racing
      # against Container cold-start / R2 hydrate: a live `/api/entries`
      # fetch returning `[]` (silent fallback in
      # `src/lib/cms-api/server-data.ts:170-176`) used to bake an empty
      # portfolio page even when the Container held 137 entries.
      - name: Dump CMS index + markdown pages from Container
        env:
          CMS_USE_RUST_API: "1"
          CMS_API_BASE_URL: ${{ secrets.CLOUDFLARE_WORKER_STAGING_URL }}
        run: |
          set -euo pipefail
          bun scripts/dump-cms-index.ts
          test -s node_modules/.cache/cms-build/cms-index.json \
            || { echo "cms-index.json missing or empty after dump"; exit 1; }
          ENTRIES=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("node_modules/.cache/cms-build/cms-index.json","utf8")).length)')
          echo "Dumped $ENTRIES index entries from Container"

      - name: Build Next.js static export (Workers Static Assets source)
        env:
          NEXT_PUBLIC_GA_ID: ${{ secrets.NEXT_PUBLIC_GA_ID }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          # Anchor absolute media URLs at the public site so the static
          # export references https://yusuke-kim.com/api/cms/media?...;
          # the Workers Router proxies /api/* to the Container in production.
          NEXT_PUBLIC_CMS_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          # Offline build: route `fetchCmsContentIndex()` /
          # `fetchMarkdownPages()` through the JSON cache emitted by the
          # previous "Dump CMS index" step instead of fetching the Container
          # live. `shouldUseRustCmsApi()` returns false → both helpers take
          # their local branch, which honours `CMS_INDEX_JSON` /
          # `CMS_MARKDOWN_JSON` (see content-db-manager.ts:491,1035).
          CMS_USE_RUST_API: "0"
          CMS_INDEX_JSON: node_modules/.cache/cms-build/cms-index.json
          CMS_MARKDOWN_JSON: node_modules/.cache/cms-build/markdown-pages.json
        run: |
          set -euo pipefail

          bun run build || {
            ec=$?
            if [ "$ec" -eq 132 ] && [ -f out/index.html ]; then
              echo "::warning::bun --bun next build exited 132 (SIGILL at teardown), but out/index.html exists; proceeding"
              exit 0
            fi
            exit "$ec"
          }

          test -f out/index.html || { echo "out/index.html missing after build"; exit 1; }

      - name: Set up Docker Buildx (Container build uses the Docker daemon)
        uses: docker/setup-buildx-action@v3

      # Push Workers Secrets to Cloudflare before deploying so the deployed
      # Worker sees the latest values. Idempotent: `wrangler secret put`
      # overwrites an existing secret with the same name. Each variable that
      # is empty in GitHub Secrets is skipped (with a warning) so partial
      # configurations still deploy — the corresponding feature degrades
      # gracefully rather than blocking the rollout.
      - name: Push Workers Secrets to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RECAPTCHA_SECRET_KEY: ${{ secrets.RECAPTCHA_SECRET_KEY }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          set -euo pipefail
          cd workers/router
          for SECRET_NAME in RESEND_API_KEY RECAPTCHA_SECRET_KEY X_BEARER_TOKEN R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY SENTRY_DSN; do
            VAL="${!SECRET_NAME:-}"
            if [ -z "$VAL" ]; then
              echo "::warning::$SECRET_NAME is empty in GitHub Secrets, skipping"
              continue
            fi
            printf '%s' "$VAL" | ./node_modules/.bin/wrangler secret put "$SECRET_NAME"
            echo "Set $SECRET_NAME"
          done

      # Bypass `cloudflare/wrangler-action` and invoke the locally-pinned
      # `wrangler` directly (`workers/router/node_modules/.bin/wrangler`,
      # currently 4.x). The action's bundled wrangler is older than the
      # syntax blocks we use in wrangler.toml (`[assets]`, `[[containers]]`
      # with `class_name`, `[[durable_objects.bindings]]`, `[[migrations]]`)
      # and errors out at "Processing wrangler.toml configuration".
      - name: Deploy Workers + Container + Static Assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          cd workers/router
          echo "Using wrangler $(./node_modules/.bin/wrangler --version) from workers/router/node_modules"
          ./node_modules/.bin/wrangler deploy --config wrangler.toml
