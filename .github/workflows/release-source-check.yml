name: Release Source Check

# Defense-in-depth: ensures `base == main` PRs come from a canonical
# `release-x-y-z` branch matching the intended target release. This is
# required when branch protection / ruleset cannot constrain the head
# branch pattern on its own. See docs/agent/release-workflow.md and
# docs/agent/quality-security.md for policy.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  release-source:
    name: Validate release source
    runs-on: ubuntu-latest
    if: github.event.pull_request.base.ref == 'main'
    steps:
      - name: Parse head branch
        id: parse
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          # Accept release-<major>-<minor>-<patch> only.
          if [[ ! "$HEAD_REF" =~ ^release-[0-9]+-[0-9]+-[0-9]+$ ]]; then
            echo "::error::PR base is 'main' but head branch '$HEAD_REF' is not a canonical 'release-x-y-z' branch. Only release PRs may target main."
            exit 1
          fi
          echo "version=${HEAD_REF#release-}" >> "$GITHUB_OUTPUT"

      - name: Cross-check target release metadata
        id: target
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          # Optional safety: PR body must declare the target release version
          # so reviewers can confirm the head branch matches intent.
          version="${HEAD_REF#release-}"
          if ! grep -qE "target[ _-]?release[^A-Za-z0-9]*$version" <<< "$PR_BODY"; then
            echo "::warning::PR body does not explicitly mention target release 'release-${version}'. Add a line such as 'Target release: release-${version}' to the description."
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Summary
        if: success()
        run: |
          echo "Release-source check passed: branch '${{ github.event.pull_request.head.ref }}' is allowed."