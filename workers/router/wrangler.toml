name = "yusuke-kim-router"
main = "src/index.ts"
compatibility_date = "2026-08-01"

[assets]
directory = "../../out"
binding = "STATIC_ASSETS"

[[r2_buckets]]
binding = "CMS_DATA"
bucket_name = "cms-data"
preview_bucket_name = "cms-data-dev"

# wrangler 4 Container schema: the Container is exposed as a Durable Object
# class (`CMSApiContainer`). The runtime binding `CMS_API` is a DO namespace
# that points at that class; worker code fetches a stub via
# `getContainer(env.CMS_API, "singleton")` (or `env.CMS_API.getByName(...)`)
# and calls `.fetch(req)` to proxy into the Rust CMS API on port 3001.
[[containers]]
class_name = "CMSApiContainer"
image = "../../apps/cms-api/Dockerfile"
instance_type = "lite"
max_instances = 1

[[durable_objects.bindings]]
name = "CMS_API"
class_name = "CMSApiContainer"

# First-time deploy of the CMSApiContainer DO class.
#
# The Cloudflare account is enrolled in the SQLite-backed DO migration
# that became mandatory after code 10099 made new key-value namespaces
# unsupported. Container DO classes don't write DO storage themselves
# (per-item state lives in R2 via the CMS_DATA binding), so SQLite vs.
# key-value is purely a namespace-shape question; the migration tag is
# what Cloudflare uses to track the DO class lifecycle, not the storage
# backend.
#
# History note: a prior deploy attempt left a stale `CmsApiContainer`
# (lowercase m/s) namespace that blocked subsequent deploys with code
# 10064. Resolved by `wrangler delete --force yusuke-kim-router`; this
# is the first clean deploy of `CMSApiContainer`.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["CMSApiContainer"]

[triggers]
crons = ["*/5 * * * *"]