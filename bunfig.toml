[install]
# Suppress peer dependency warnings
peer = false
# trustedDependencies are configured in package.json to keep a single source of truth.

# Test runner is configured in package.json (`bun run test`). The block below
# only shapes the optional coverage output. Threshold is intentionally NOT
# set: Bun coverage is import-driven and lacks branch coverage in 1.3, so a
# hard gate would either fail on legitimate untested modules or undercount
# branches. Re-evaluate once Bun ships branch coverage or this repo moves
# to jest@30 (see docs/adr/0008-bun-test-canonical.md).
[test]
# Redirect `CONTENT_DATA_DIR` to a temp dir BEFORE any CMS module loads.
# The CMS modules resolve the data dir at module init time, so an env-var
# assignment inside a test file is too late (ES module imports hoist).
preload = ["./scripts/test-preload.ts"]

coverage = false
coverageReporter = ["text", "lcov"]
coverageDir = "./coverage"
coveragePathIgnorePatterns = [
  "**/*.spec.ts",
  "**/*.bun.test.ts",
  "**/*.test.ts",
  "src/test-utils/**",
  "scripts/**",
  "src/app/tools/ProtoType/**",
]
coverageSkipTestFiles = true
